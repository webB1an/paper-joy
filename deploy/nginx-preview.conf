# Private preview only: reach through an SSH local-forward. No public listener.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    client_max_body_size 120m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    access_log /www/wwwroot/paper-joy/shared/logs/preview.access.log;
    error_log /www/wwwroot/paper-joy/shared/logs/preview.error.log;
    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /www/wwwroot/paper-joy/current/apps/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /assets/ {
        alias /www/wwwroot/paper-joy/shared/storage/public/;
        autoindex off;
        limit_except GET HEAD { deny all; }
    }
    location ~ ^/(api/|r/|health$) {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location ~ /\. { deny all; }
    location / { return 404; }
}
