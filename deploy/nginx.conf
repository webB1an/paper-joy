server {
    listen 80;
    server_name paper-joy.wdbzk.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/paper-joy/shared/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name paper-joy.wdbzk.com;
    ssl_certificate /www/wwwroot/paper-joy/shared/cert/fullchain.pem;
    ssl_certificate_key /www/wwwroot/paper-joy/shared/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 120m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    access_log /www/wwwroot/paper-joy/shared/logs/access.log;
    error_log /www/wwwroot/paper-joy/shared/logs/nginx.error.log;
    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /www/wwwroot/paper-joy/current/apps/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /assets/ {
        alias /www/wwwroot/paper-joy/shared/storage/public/;
        autoindex off;
        expires 1d;
        limit_except GET HEAD { deny all; }
    }
    location ~ ^/(api/|r/|health$) {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    location ~ /\. { deny all; }
    location / { return 404; }
}
